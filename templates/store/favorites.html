{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg">
  <div class="container">
    <h2 class="title-page mb-4">Mis favoritos</h2>
    <div class="row">
      {% if products %}
      {% for product in products %}
      <div class="col-md-4">
        <figure class="card card-product-grid">
          <div class="img-wrap">
            <a href="{{ product.get_url }}"><img src="{{ product.images.url }}" alt="{{ product.product_name }}"></a>
            <div class="rating-star mt-2" aria-label="Calificación: {{ product.averageReview }} de 5 estrellas">
              {% for star in "12345" %}
              <i class="fa fa-star{% if product.averageReview < forloop.counter %}-o{% endif %}" aria-hidden="true"></i>
              {% endfor %}
              <small>({{ product.countReview }})</small>
            </div>
          </div>
          <figcaption class="info-wrap">
            <a href="{{ product.get_url }}" class="title">{{ product.product_name }}</a>
            <div class="price-wrap mt-2 mb-3">
              <span class="price">{{ product.price }}</span>
            </div>
            <a href="{% url 'toggle_favorite' product.id %}" class="btn btn-block btn-outline-primary">
              <i class="fa fa-star"></i> Quitar de favoritos
            </a>
          </figcaption>
        </figure>
      </div>
      {% endfor %}
      {% else %}
      <div class="col-12">
        <p class="text-muted">Todavía no tienes productos favoritos.</p>
        <a href="{% url 'store' %}" class="btn btn-primary">Ver productos</a>
      </div>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
